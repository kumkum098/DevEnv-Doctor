<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101015" />
    <title>DevEnv Doctor</title>
    <link rel="stylesheet" href="/assets/dashboard.css" />
    <script src="/assets/dashboard.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#overview" aria-label="DevEnv Doctor overview">
          <span class="brand-mark" aria-hidden="true">D</span>
          <span class="brand-name">DevEnv <b>Doctor</b></span>
        </a>

        <div class="nav-label">Workspace</div>
        <nav class="navigation">
          <button class="nav-link active" data-page="overview">Overview</button>
          <button class="nav-link" data-page="diagnostics">Diagnostics</button>
          <button class="nav-link" data-page="dependencies">Dependencies</button>
          <button class="nav-link" data-page="environment">Environment</button>
          <button class="nav-link" data-page="runtime">Runtime</button>
          <button class="nav-link" data-page="reports">Reports</button>
        </nav>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span><b>Local scan</b><small id="scan-state">Connecting</small></span>
          <span class="local-lock" aria-label="Local only">LOCAL</span>
        </div>
      </aside>

      <main class="main-shell">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span>/</span><b id="breadcrumb-title">Overview</b></div>
          <div class="topbar-actions">
            <span class="updated-label" id="updated-label">Waiting for scan</span>
            <button class="button button-secondary" id="refresh-button" type="button">Refresh scan</button>
          </div>
        </header>

        <section class="page-heading">
          <div>
            <p class="eyebrow">LOCAL ENVIRONMENT MONITOR</p>
            <h1 id="page-title">Overview</h1>
            <p id="page-subtitle">Environment health and diagnostic summary</p>
          </div>
          <div class="project-chip"><span class="project-chip-dot"></span><span id="project-label">Current directory</span></div>
        </section>

        <div id="page-content" aria-live="polite">
          <div class="loading-state"><span class="loader"></span><span>Collecting local diagnostics</span></div>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </main>
    </div>
  </body>
</html>
